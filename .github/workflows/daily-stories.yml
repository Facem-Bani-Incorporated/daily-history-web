name: Publish the day's story

on:
  schedule:
    # 05:40 UTC, a little after the content pipeline publishes. Cron on GitHub is
    # best-effort and can run late under load, which is fine: the generator is
    # idempotent, so a late or repeated run produces the same site.
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'How many past days to (re)build. Blank = every day the API offers.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-stories
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Generate pages
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            node build/generate.js --limit "${{ github.event.inputs.backfill }}"
          else
            node build/generate.js
          fi

      - name: Commit whatever changed
        run: |
          git config user.name  "daily-history-bot"
          git config user.email "actions@github.com"
          git add -A
          # No changes is the normal outcome on a day the pipeline published
          # nothing new, and must not fail the run.
          if git diff --staged --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "Publish stories for $(date -u +%Y-%m-%d)"
          git push
