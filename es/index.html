  <style>
    :root { --imperial: #6e0f14; --imperial-deep: #4a080c; --imperial-dark: #2c0507; --gold: #c9a24b; --gold-bright: #e7c878; --marble: #f4efe6; --marble-dim: #d8d0c2; --ink: #1a0a0b; }

    html { scroll-behavior: smooth; }

    .vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; box-shadow: inset 0 0 220px 40px rgba(20,3,4,0.85); }
    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 48px 28px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; }
    .eyebrow { font-size: 0.72rem; letter-spacing: 0.42em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 30px; opacity: 0; animation: rise 0.9s ease 0.1s forwards; }
    .eyebrow .dot { display: inline-block; width: 4px; height: 4px; background: var(--gold); border-radius: 50%; vertical-align: middle; margin: 0 0.9em; opacity: 0.6; }
    .logo-wrap { position: relative; margin-bottom: 36px; opacity: 0; animation: rise 1s ease 0.25s forwards; }
    .logo-wrap::before { content: ""; position: absolute; inset: -14%; background: radial-gradient(circle, rgba(201,162,75,0.32) 0%, transparent 68%); z-index: -1; filter: blur(6px); }
    .logo { width: 168px; height: 168px; border-radius: 36px; display: block; box-shadow: 0 24px 60px -18px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,162,75,0.35), 0 0 0 6px rgba(201,162,75,0.08); }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1.02; letter-spacing: 0.01em; color: var(--marble); opacity: 0; animation: rise 1s ease 0.4s forwards; }
    h1 .em { font-style: italic; color: var(--gold-bright); }
    .rule { width: 54px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 22px 0 20px; opacity: 0; animation: rise 1s ease 0.5s forwards; }
    .tagline { font-size: 1.06rem; line-height: 1.6; color: var(--marble-dim); max-width: 30ch; font-weight: 400; opacity: 0; animation: rise 1s ease 0.6s forwards; }
    .stores { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; margin-top: 40px; opacity: 0; animation: rise 1s ease 0.75s forwards; }
    .store-btn { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; padding: 16px 22px; border-radius: 15px; text-decoration: none; font-weight: 600; font-size: 1rem; letter-spacing: 0.01em; transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease; border: 1px solid transparent; }
    .store-btn svg { flex-shrink: 0; }
    .store-btn .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
    .store-btn .lbl small { font-size: 0.66rem; font-weight: 500; opacity: 0.72; letter-spacing: 0.06em; text-transform: uppercase; }
    .store-btn .lbl span { font-size: 1.08rem; }
    .store-btn.primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--imperial-dark); box-shadow: 0 14px 34px -12px rgba(201,162,75,0.7); }
    .store-btn.primary:hover { transform: translateY(-3px); box-shadow: 0 20px 44px -12px rgba(201,162,75,0.85); }
    .store-btn.secondary { background: rgba(244,239,230,0.06); color: var(--marble); border-color: rgba(201,162,75,0.4); backdrop-filter: blur(6px); }
    .store-btn.secondary:hover { transform: translateY(-3px); background: rgba(244,239,230,0.1); border-color: rgba(201,162,75,0.7); }
    .store-btn:active { transform: translateY(-1px); }
    .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin-top: 38px; opacity: 0; animation: rise 1s ease 0.9s forwards; }
    .pill { font-size: 0.78rem; color: var(--marble-dim); letter-spacing: 0.03em; display: inline-flex; align-items: center; gap: 7px; }
    .pill::before { content: ""; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }
    footer { text-align: center; padding: 24px 20px 30px; font-size: 0.74rem; color: rgba(216,208,194,0.45); letter-spacing: 0.04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .eyebrow, .logo-wrap, h1, .rule, .tagline, .stores, .features { opacity: 1 !important; } }
    @media (min-width: 560px) { .stores { flex-direction: row; max-width: 460px; } .store-btn { padding: 15px 18px; } }
    @media (max-width: 360px) { .logo { width: 142px; height: 142px; } }
